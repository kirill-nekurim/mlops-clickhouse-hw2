fraud_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: "{{ env_var('CLICKHOUSE_SCHEMA', 'fraud_analytics') }}"
      host: "{{ env_var('CLICKHOUSE_HOST', '127.0.0.1') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '18123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'dbt') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'dbt_local') }}"
      driver: http
      secure: false
      threads: 2
      connect_timeout: 10
      send_receive_timeout: 120
